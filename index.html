<!DOCTYPE html>
<html>
<head>
<title>Life RPG</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  text-align: center;
  overflow: hidden;
  background: radial-gradient(circle at top, #1e293b, #020617);
}

/* glowing background animation */
body::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, #38bdf8 0%, transparent 70%);
  animation: moveBg 10s infinite linear;
  opacity: 0.15;
}

@keyframes moveBg {
  0% { transform: translate(-25%, -25%); }
  50% { transform: translate(0%, 0%); }
  100% { transform: translate(-25%, -25%); }
}

.container {
  position: relative;
  top: 50%;
  transform: translateY(-50%);
}

.bar {
  width: 300px;
  height: 20px;
  background: #1e293b;
  border-radius: 20px;
  overflow: hidden;
  margin: 20px auto;
  box-shadow: 0 0 10px #38bdf8;
}

.fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #22c55e, #4ade80);
  transition: width 1s;
  box-shadow: 0 0 20px #22c55e;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 12px;
  background: #38bdf8;
  color: black;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 15px #38bdf8;
}

/* LEVEL UP POPUP */
#popup {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 30px;
  color: gold;
  text-shadow: 0 0 20px gold;
  transition: 0.4s;
}

</style>
</head>

<body>

<div class="container">
  <h1>🎮 Level <span id="level">1</span></h1>
  <p>XP: <span id="xp">0</span> / <span id="maxxp">100</span></p>

  <div class="bar">
    <div class="fill" id="xpbar"></div>
  </div>

  <button onclick="gainXP()">+ Complete Task</button>
</div>

<div id="popup">🔥 LEVEL UP!</div>

<audio id="sound" src="https://www.myinstants.com/media/sounds/level-up.mp3"></audio>

<script>
let xp = localStorage.getItem("xp") || 0;
let level = localStorage.getItem("level") || 1;
let maxXP = localStorage.getItem("maxXP") || 100;

xp = parseInt(xp);
level = parseInt(level);
maxXP = parseInt(maxXP);

function updateUI() {
  document.getElementById("xp").innerText = xp;
  document.getElementById("level").innerText = level;
  document.getElementById("maxxp").innerText = maxXP;
  document.getElementById("xpbar").style.width = (xp / maxXP * 100) + "%";
}

function gainXP() {
  xp += 20;

  if (xp >= maxXP) {
    xp -= maxXP;
    level++;
    maxXP += 50;

    let popup = document.getElementById("popup");
    popup.style.transform = "translate(-50%, -50%) scale(1)";
    setTimeout(() => {
      popup.style.transform = "translate(-50%, -50%) scale(0)";
    }, 1500);

    document.getElementById("sound").play();
  }

  localStorage.setItem("xp", xp);
  localStorage.setItem("level", level);
  localStorage.setItem("maxXP", maxXP);

  updateUI();
}

updateUI();
</script>

</body>
</html>
