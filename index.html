<!DOCTYPE html>
<html>
<head>
  <title>Life RPG</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      width: 320px;
      margin: 20px auto;
      box-shadow: 0 0 15px #38bdf8;
    }

    .bar {
      width: 100%;
      height: 20px;
      background: #334155;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transition: width 1s;
      box-shadow: 0 0 10px #22c55e;
    }

    button {
      margin: 5px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      font-weight: bold;
      cursor: pointer;
    }

    #levelup {
      color: gold;
      font-size: 20px;
      opacity: 0;
      transition: 0.5s;
    }
  </style>
</head>

<body>

<h1>🎮 Suhail - Level <span id="level">1</span></h1>
<p>XP: <span id="xp">0</span> / <span id="maxxp">100</span></p>
<p id="levelup">🔥 LEVEL UP!</p>

<div class="card">

  <p>🎥 Creator</p>
  <div class="bar"><div class="fill" id="creator"></div></div>

  <p>🧠 Knowledge</p>
  <div class="bar"><div class="fill" id="knowledge"></div></div>

  <p>⚡ Discipline</p>
  <div class="bar"><div class="fill" id="discipline"></div></div>

</div>

<button onclick="addXP(20)">🎯 Task +20 XP</button>
<button onclick="addXP(40)">🔥 Big Task +40 XP</button>

<script>
let xp = localStorage.getItem("xp") || 0;
let level = localStorage.getItem("level") || 1;
let maxXP = localStorage.getItem("maxXP") || 100;

xp = parseInt(xp);
level = parseInt(level);
maxXP = parseInt(maxXP);

function updateUI() {
  document.getElementById("xp").innerText = xp;
  document.getElementById("level").innerText = level;
  document.getElementById("maxxp").innerText = maxXP;

  document.getElementById("creator").style.width = (xp % 100) + "%";
  document.getElementById("knowledge").style.width = (xp % 80) + "%";
  document.getElementById("discipline").style.width = (xp % 70) + "%";
}

function addXP(amount) {
  xp += amount;

  if (xp >= maxXP) {
    xp -= maxXP;
    level++;
    maxXP += 50;

    let lvl = document.getElementById("levelup");
    lvl.style.opacity = 1;
    setTimeout(() => lvl.style.opacity = 0, 1500);
  }

  localStorage.setItem("xp", xp);
  localStorage.setItem("level", level);
  localStorage.setItem("maxXP", maxXP);

  updateUI();
}

updateUI();
</script>

</body>
</html>
