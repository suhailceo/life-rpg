<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life RPG</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  background: radial-gradient(circle at top, #1e293b, #020617);
}

/* container fix */
.container {
  max-width: 400px;
  margin: auto;
  padding: 20px;
  text-align: center;
}

/* responsive bar */
.bar {
  width: 100%;
  height: 20px;
  background: #1e293b;
  border-radius: 20px;
  overflow: hidden;
  margin: 15px 0;
  box-shadow: 0 0 10px #38bdf8;
}

.fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #22c55e, #4ade80);
  transition: width 1s;
  box-shadow: 0 0 15px #22c55e;
}

/* button fix */
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  background: #38bdf8;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.95);
}

/* popup fix */
#popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 24px;
  color: gold;
  text-shadow: 0 0 15px gold;
  transition: 0.4s;
}
</style>
</head>

<body>

<div class="container">
  <h1>🎮 Level <span id="level">1</span></h1>
  <p>XP: <span id="xp">0</span> / <span id="maxxp">100</span></p>

  <div class="bar">
    <div class="fill" id="xpbar"></div>
  </div>

  <button onclick="gainXP()">+ Complete Task</button>
</div>

<div id="popup">🔥 LEVEL UP!</div>

<script>
let xp = localStorage.getItem("xp") || 0;
let level = localStorage.getItem("level") || 1;
let maxXP = localStorage.getItem("maxXP") || 100;

xp = parseInt(xp);
level = parseInt(level);
maxXP = parseInt(maxXP);

function updateUI() {
  document.getElementById("xp").innerText = xp;
  document.getElementById("level").innerText = level;
  document.getElementById("maxxp").innerText = maxXP;
  document.getElementById("xpbar").style.width = (xp / maxXP * 100) + "%";
}

function gainXP() {
  xp += 20;

  if (xp >= maxXP) {
    xp -= maxXP;
    level++;
    maxXP += 50;

    let popup = document.getElementById("popup");
    popup.style.transform = "translate(-50%, -50%) scale(1)";
    setTimeout(() => popup.style.transform = "translate(-50%, -50%) scale(0)", 1500);
  }

  localStorage.setItem("xp", xp);
  localStorage.setItem("level", level);
  localStorage.setItem("maxXP", maxXP);

  updateUI();
}

updateUI();
</script>

</body>
</html>
